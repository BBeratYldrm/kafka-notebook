spring:
  application:
    name: kafka-demo
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # OFFSET RESET STRATEGY:
      # earliest = consumer ilk başladığında en baştan okur
      # latest   = sadece yeni mesajları okur
      #
      # HOW OFFSET WORKS:
      # Kafka stores "how far each consumer has read" in a special
      # internal topic called __consumer_offsets.
      # On restart, consumer picks up exactly where it left off.
      auto-offset-reset: earliest
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer